name: Forest indices and perimeter severity
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
    inputs:
      as_of:
        description: End-exclusive date; blank means today UTC
        default: ''
      max_events:
        description: Maximum waiting perimeters per batch (8 batches)
        default: '120'
permissions:
  contents: write
concurrency:
  group: forest-products
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r forest/requirements.txt
      - run: python -m unittest discover -s tests -p test_forest.py -v
      - name: Restore durable product ledger
        run: |
          if git ls-remote --exit-code origin refs/heads/forest-products >/dev/null 2>&1; then
            git fetch origin forest-products
            mkdir -p forest-products
            git archive FETCH_HEAD | tar -x -C forest-products
          fi
      - name: National indices and perimeter discovery
        continue-on-error: true
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          AS_OF: ${{ inputs.as_of }}
        run: python -u forest/pipeline.py --mode prepare --as-of "${AS_OF:-$(date -u +%F)}"
      - name: Preserve base products without artifact storage
        if: always()
        run: bash forest/publish_products.sh forest-base forest-products
  severity:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r forest/requirements.txt
      - name: Read base products for this execution
        run: |
          git fetch origin forest-base
          mkdir -p forest-products
          git archive FETCH_HEAD | tar -x -C forest-products
          python - <<'PY'
          import os,json
          assert str(json.load(open('forest-products/forest-status.json'))['source_run_id'])==os.environ['GITHUB_RUN_ID']
          PY
      - name: Calculate assigned perimeters
        continue-on-error: true
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          AS_OF: ${{ inputs.as_of }}
          MAX_EVENTS: ${{ inputs.max_events || '120' }}
          SHARD: ${{ matrix.shard }}
        run: python -u forest/pipeline.py --mode severity --shard "$SHARD" --shards 8 --max-events "$MAX_EVENTS" --as-of "${AS_OF:-$(date -u +%F)}"
      - name: Preserve assigned batch without artifact storage
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: bash forest/publish_products.sh "forest-batch-$SHARD" forest-products
  publish:
    needs: [prepare, severity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read base and batch branches
        run: |
          mkdir -p batches/forest-base
          git fetch origin forest-base
          git archive FETCH_HEAD | tar -x -C batches/forest-base
          for shard in 0 1 2 3 4 5 6 7; do
            if git fetch origin "forest-batch-$shard"; then
              mkdir -p "batches/forest-shard-$shard"
              git archive FETCH_HEAD | tar -x -C "batches/forest-shard-$shard"
            fi
          done
      - run: python forest/merge_batches.py batches forest-products "$GITHUB_RUN_ID"
      - name: Publish actual products with durable queue
        run: bash forest/publish_products.sh forest-products forest-products
      - name: Fail visibly if any product failed
        run: |
          python - <<'PY'
          import json
          status=json.load(open('forest-products/forest-status.json'))
          assert status['status'] == 'processed', status['status']
          PY
