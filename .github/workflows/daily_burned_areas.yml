name: Deteção Diária e Exportação via Rclone

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      export_drive:
        description: Enviar resultados para Google Drive (requer OAuth)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: burned-areas-daily
  cancel-in-progress: false

jobs:
  run-gee-rclone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install -r seasonal/requirements.txt

      - name: Verificar regressões de datas e dados em falta
        run: python -m unittest discover -s tests -v

      - name: Executar Deteção de Áreas Ardidas
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python detect_burnt_areas.py

      - name: Ler resultado do processamento
        id: resultado
        run: |
          python - <<'PY'
          import json, os
          with open('outputs/run_status.json', encoding='utf-8') as f:
              report = json.load(f)

          status = report.get('status', 'unknown')
          count = int(report.get('feature_count', 0))
          export_drive = 'true' if status == 'processed' and count > 0 else 'false'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"status={status}\n")
              f.write(f"feature_count={count}\n")
              f.write(f"export_drive={export_drive}\n")
          PY

      - name: Preservar GeoJSON e relatório
        uses: actions/upload-artifact@v4
        with:
          name: burned-areas-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90

      - name: Resumo do processamento
        run: |
          python - <<'PY'
          import json, os

          with open('outputs/run_status.json', encoding='utf-8') as f:
              report = json.load(f)

          status = report.get('status')
          count = int(report.get('feature_count', 0))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Resultado da deteção\n\n')

              if status == 'no_polygons':
                  f.write('✅ **Processamento concluído sem erro: não foram detetados polígonos de área ardida.**\n\n')
              elif status in ('no_post_images', 'no_pre_images'):
                  f.write('⚠️ **Processamento concluído sem erro, mas não existem imagens Sentinel-2 suficientes para confirmar presença ou ausência de polígonos.**\n\n')
              elif status == 'processed':
                  f.write(f'✅ **Processamento concluído: {count} polígonos detetados.**\n\n')
              else:
                  f.write(f'⚠️ **Estado inesperado do processamento: {status}.**\n\n')

              for key, value in report.items():
                  f.write(f'- {key}: {value}\n')
          PY

      - name: Informação quando não há dados para exportar
        if: steps.resultado.outputs.export_drive != 'true'
        run: |
          echo "Não há polígonos válidos para exportar para o Google Drive. O workflow termina com sucesso."
          echo "Estado: ${{ steps.resultado.outputs.status }}"
          echo "Polígonos: ${{ steps.resultado.outputs.feature_count }}"

      - name: Validar autenticação Google Drive
        if: steps.resultado.outputs.export_drive == 'true' && (github.event_name == 'schedule' || inputs.export_drive)
        env:
          DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          if [ -z "$DRIVE_TOKEN" ]; then
            echo '::error::Foram detetados polígonos, mas falta configurar RCLONE_DRIVE_TOKEN. Os resultados foram preservados nos artefactos.'
            exit 1
          fi

      - name: Instalar Rclone
        if: steps.resultado.outputs.export_drive == 'true' && (github.event_name == 'schedule' || inputs.export_drive)
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Enviar resultados para Google Drive com OAuth
        if: steps.resultado.outputs.export_drive == 'true' && (github.event_name == 'schedule' || inputs.export_drive)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 1BoyO9QNldRid_j2G8Q8qIS9GkpfSDI_X
        run: |
          rclone copy ./outputs gdrive: --include '*.geojson' --include 'run_status.json' --retries 3
          rclone check ./outputs gdrive: --include '*.geojson' --include 'run_status.json' --one-way
