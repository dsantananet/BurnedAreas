name: Deteção Diária e Exportação para Google Drive

on:
  schedule:
    - cron: '0 3 * * *'  # Executa todos os dias às 03:00 UTC (04:00 de Portugal)
  workflow_dispatch:     # Permite testar manualmente clicando num botão

jobs:
  run-gee-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Earth Engine API
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api

      - name: Executar Deteção e Exportar para Drive
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          python detect_burnt_areas.py
