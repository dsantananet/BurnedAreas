name: Deteção Diária e Exportação para Google Drive

on:
  schedule:
    - cron: '0 3 * * *'  # Executa automaticamente todos os dias às 03:00 UTC
  workflow_dispatch:     # Permite executar manualmente pelo botão no GitHub

jobs:
  run-gee-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências (EE API & Google Drive API)
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Executar Deteção e Exportar para Drive
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          python detect_burnt_areas.py
