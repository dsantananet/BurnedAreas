name: Deteção Diária e Exportação via Rclone

on:
  schedule:
    - cron: '0 3 * * *'  # Executa diariamente às 03:00 UTC
  workflow_dispatch:     # Execução manual pelo botão no GitHub

jobs:
  run-gee-rclone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências (Earth Engine API)
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api

      - name: Instalar Rclone
        run: |
          sudo curl https://rclone.org/install.sh | sudo bash

      - name: Executar Deteção de Áreas Ardidas
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          python detect_burnt_areas.py

      - name: Enviar GeoJSON para o Google Drive via Rclone
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          # Criar ficheiro de credenciais temporário
          echo "$GEE_SERVICE_ACCOUNT_KEY" > sa_key.json

          # Configurar o Rclone dinamicamente para usar a Service Account
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $(pwd)/sa_key.json
          root_folder_id = 1BoyO9QNldRid_j2G8Q8qIS9GkpfSDI_X
          EOF

          # Executar a cópia direta para o Google Drive
          rclone copy ./outputs gdrive: -v

          # Apagar a chave por segurança
          rm sa_key.json
