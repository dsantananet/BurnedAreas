name: Deteção Diária e Exportação via Rclone

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      export_drive:
        description: Enviar resultados para Google Drive (requer OAuth)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: burned-areas-daily
  cancel-in-progress: false

jobs:
  run-gee-rclone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install -r seasonal/requirements.txt

      - name: Verificar regressões de datas e dados em falta
        run: python -m unittest discover -s tests -v

      - name: Executar Deteção de Áreas Ardidas
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python detect_burnt_areas.py

      - name: Ler resultado do processamento
        id: resultado
        run: |
          python - <<'PY'
          import json, os
          with open('outputs/run_status.json', encoding='utf-8') as f:
              report = json.load(f)

          status = report.get('status', 'unknown')
          count = int(report.get('feature_count', 0))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"status={status}\n")
              f.write(f"feature_count={count}\n")
          PY

      - name: Preservar GeoJSON e relatório
        uses: actions/upload-artifact@v4
        with:
          name: burned-areas-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90

      - name: Resumo do processamento
        run: |
          python - <<'PY'
          import json, os

          with open('outputs/run_status.json', encoding='utf-8') as f:
              report = json.load(f)

          status = report.get('status')
          count = int(report.get('feature_count', 0))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Resultado da deteção\n\n')

              if status == 'no_polygons':
                  f.write('✅ **Processamento concluído sem erro: não foram detetados polígonos de área ardida.**\n\n')
              elif status in ('no_post_images', 'no_pre_images'):
                  f.write('⚠️ **Processamento concluído sem erro, mas não existem imagens Sentinel-2 suficientes para confirmar presença ou ausência de polígonos.**\n\n')
              elif status == 'processed':
                  f.write(f'✅ **Processamento concluído: {count} polígonos detetados.**\n\n')
              else:
                  f.write(f'⚠️ **Estado inesperado do processamento: {status}.**\n\n')

              for key, value in report.items():
                  f.write(f'- {key}: {value}\n')
          PY

      - name: Verificar autenticação Google Drive
        id: drive_auth
        if: github.event_name == 'schedule' || inputs.export_drive
        env:
          DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          if [ -z "$DRIVE_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RCLONE_DRIVE_TOKEN não está configurado. Os ficheiros ficam preservados nos artefactos do GitHub, mas não podem ser enviados para o Google Drive."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Rclone 1.75.1
        if: (github.event_name == 'schedule' || inputs.export_drive) && steps.drive_auth.outputs.configured == 'true'
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 /tmp/rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone
          rclone version

      - name: Preparar configuração Rclone
        if: (github.event_name == 'schedule' || inputs.export_drive) && steps.drive_auth.outputs.configured == 'true'
        env:
          RAW_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ["RAW_TOKEN"].strip()

          # Aceita tanto o JSON puro como uma cópia acidental da linha
          # "token = {...}" do rclone.conf.
          if token.lower().startswith("token"):
              if "=" not in token:
                  raise SystemExit("RCLONE_DRIVE_TOKEN inválido: falta '=' após 'token'.")
              token = token.split("=", 1)[1].strip()

          # Remove aspas exteriores acidentais, preservando o JSON interno.
          if len(token) >= 2 and token[0] == token[-1] and token[0] in ("'", '"'):
              token = token[1:-1].strip()

          try:
              parsed = json.loads(token)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"RCLONE_DRIVE_TOKEN não contém JSON válido: {exc.msg} "
                  f"(posição {exc.pos}). Copiar apenas o conteúdo {{...}} da linha token."
              )

          if not isinstance(parsed, dict) or "refresh_token" not in parsed:
              raise SystemExit("RCLONE_DRIVE_TOKEN inválido: não contém refresh_token.")

          config_dir = Path.home() / ".config" / "rclone"
          config_dir.mkdir(parents=True, exist_ok=True)
          config_file = config_dir / "rclone.conf"

          # json.dumps compacta e normaliza o token sem o mostrar nos logs.
          token_json = json.dumps(parsed, separators=(",", ":"))
          config_file.write_text(
              "[gdrive]\n"
              "type = drive\n"
              f"client_id = {os.environ['CLIENT_ID']}\n"
              f"client_secret = {os.environ['CLIENT_SECRET']}\n"
              "scope = drive\n"
              f"token = {token_json}\n"
              "root_folder_id = 1BoyO9QNldRid_j2G8Q8qIS9GkpfSDI_X\n",
              encoding="utf-8",
          )
          config_file.chmod(0o600)
          print("Configuração Rclone validada e preparada.")
          PY

      - name: Testar acesso à pasta Google Drive
        if: (github.event_name == 'schedule' || inputs.export_drive) && steps.drive_auth.outputs.configured == 'true'
        run: |
          rclone lsf gdrive: --max-depth 1 >/dev/null
          echo "Acesso ao Google Drive confirmado."

      - name: Enviar resultados diários para Google Drive com OAuth
        if: (github.event_name == 'schedule' || inputs.export_drive) && steps.drive_auth.outputs.configured == 'true'
        run: |
          rclone copy ./outputs gdrive: --include '*.geojson' --include 'run_status.json' --retries 3
          rclone check ./outputs gdrive: --include '*.geojson' --include 'run_status.json' --one-way
